name: PNCP Radar
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python pncp_radar.py
      
      - name: Upload CSV
        uses: actions/upload-artifact@v4
        with:
          name: pncp-oportunidades
          path: pncp_oportunidades.csv
          retention-days: 30
