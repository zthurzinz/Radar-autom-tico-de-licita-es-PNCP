name: PNCP Radar
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: python pncp_radar.py
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: prospeccao-faus
          path: |
            radar_faus_completo.csv
            relatorio_leitura_faus.txt
