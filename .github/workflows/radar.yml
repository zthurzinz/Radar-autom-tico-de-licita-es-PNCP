name: PNCP Radar

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependencias
        run: pip install -r requirements.txt

      - name: Executar Radar Faus Engenharia
        run: python pncp_radar.py

      - name: Upload do Relatorio Final
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-faus-final
          path: relatorio_obras_faus.txt
          retention-days: 30
