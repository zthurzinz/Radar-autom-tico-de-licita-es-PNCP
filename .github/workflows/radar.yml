name: PNCP Radar

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - run: python -m pip install --upgrade pip && pip install requests

      - run: python pncp_radar.py

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prospeccao-faus
          path: |
            radar_faus_completo.csv
            relatorio_leitura_faus.txt
